name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check skills tests outils banc_essai

  tests:
    name: tests (Python ${{ matrix.python-version }}, versions verrouillées)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-lock.txt
      - name: Tests et couverture (seuil dans pyproject.toml)
        run: |
          python -m coverage run -m pytest -v -rxs
          python -m coverage report
      - name: Banc d'essai à blanc (le moteur seul reproduit les 59 valeurs des variantes)
        run: |
          python banc_essai/variantes/essai_a_blanc.py > essai.json
          python -c "import json; d = json.load(open('essai.json'))['moteur']['ensemble']; print(d); assert d['justes'] == d['total']"
      - run: python outils/construire_zip.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: calcul-actuariel-zip
          path: dist/calcul-actuariel.zip

  versions-recentes:
    name: tests (Python 3.13, dernières versions dans les bornes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -rxs

  audit:
    name: audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements-lock.txt --strict

  publication:
    name: publication de la version (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [qualite, tests, versions-recentes, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - name: Le tag correspond à la version du moteur
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'skills/calcul-actuariel/scripts'); from actuaire import __version__; print(__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python outils/construire_zip.py
      - name: Notes de version tirées du CHANGELOG
        run: python outils/notes_de_version.py "${GITHUB_REF_NAME#v}" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/calcul-actuariel.zip --title "${GITHUB_REF_NAME}" --notes-file notes.md
