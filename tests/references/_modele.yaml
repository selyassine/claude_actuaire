# Modèle de fiche de référence.
# Une fiche = une publication appliquée à un jeu de données.
# Les fichiers dont le nom commence par "_" ne sont pas chargés par les tests.
#
# Règles :
# - Toute valeur attendue est recopiée de la publication citée, jamais calculée par Claude.
# - "statut" passe de "en_attente" à "valide" uniquement quand l'auteur a contrôlé
#   chaque valeur contre la publication. Les tests "en_attente" sont signalés mais ne bloquent pas.
# - "tolerance_absolue" reflète l'arrondi publié (0.5 si la source arrondit à l'unité).

id: exemple-chain-ladder-taylor-ashe
methode: chain_ladder             # nom de la commande du moteur
source:
  reference: "Mack, T. (1993). Distribution-free calculation of the standard error of chain ladder reserve estimates. ASTIN Bulletin 23(2), 213-225."
  url: "https://doi.org/10.2143/AST.23.2.2005092"
  emplacement: "Tableau X, page Y"  # à relever précisément
donnees: donnees/taylor_ashe.csv  # chemin relatif à tests/
options: {}                       # options passées à la commande
statut: en_attente                # en_attente | valide
saisie_par: "Claude, depuis la publication"
valide_par: null                  # nom de l'actuaire qui a contrôlé
date_validation: null
valeurs:
  # chemin dans le JSON de sortie (clés séparées par des points) : valeur publiée
  - chemin: resultats.ibnr_total
    attendu: 0
    tolerance_absolue: 0.5
    note: "Valeur fictive dans ce modèle."
