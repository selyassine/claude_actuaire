id: actuar-hachemeister-regression
methode: credibilite
source:
  reference: Dutang, C., Goulet, V., Milhaud, X. et Pigeon, M. Credibility theory features of actuar.
    Vignette du paquet R actuar (CRAN), version du dépôt cran/actuar.
  url: https://cran.r-project.org/package=actuar
  emplacement: Section 5, régression cm(..., regformula = ~ time) et predict(fit, newdata = data.frame(time
    = 13)) (p. 9-10)
donnees: donnees/hachemeister.csv
options:
  modele: regression
  periode-future: 13
statut: valide
saisie_par: extraction automatisée du texte de la vignette (PDF)
valide_par: Yassine
date_validation: '2026-11-03'
methode_validation: Yassine a contrôlé les valeurs contre la vignette actuar le 2026-11-03.
note: 'Sortie du logiciel actuar publiée par ses auteurs dans la vignette (pas un article à comité de
  lecture). Données : matrice hachemeister du même paquet (Hachemeister 1975, 5 États, 12 trimestres),
  au format long dans donnees/hachemeister.csv. Valeurs publiées arrondies : tolérance d''une demi-unité
  du dernier chiffre affiché.'
